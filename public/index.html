<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="description" content="Bethany Does Things — puzzles, projects and a little bit of fun.">
  <title>Bethany Does Things</title>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #30234a;
      background: #fffaff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 70vh;
      min-height: min(820px, 85svh);
      padding: 3rem clamp(2rem, 6vw, 6rem);
      overflow: hidden;
      isolation: isolate;
      background: #30234a;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
      background: linear-gradient(
        90deg,
        rgb(20 12 35 / 18%) 0%,
        rgb(20 12 35 / 7%) 38%,
        rgb(20 12 35 / 0%) 68%
      );
    }

    .hero-background {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-logo {
      display: block;
      width: clamp(260px, 35vw, 510px);
      max-height: 58vh;
      object-fit: contain;
      object-position: left center;
      filter: drop-shadow(0 8px 24px rgb(0 0 0 / 28%));
    }

    .intro {
      padding: clamp(3rem, 8vw, 6rem) 1.5rem;
      text-align: center;
      background:
        radial-gradient(circle at 15% 15%, #ffe0f1 0, transparent 38%),
        radial-gradient(circle at 85% 80%, #c8f7f3 0, transparent 42%),
        linear-gradient(135deg, #fffaff, #eef4ff);
    }

    .intro-content {
      width: min(100%, 48rem);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
    }

    .intro p {
      max-width: 42rem;
      margin: 0 auto 1rem;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.75;
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 62vh;
        min-height: 62svh;
        justify-content: center;
        padding: 2rem 1.25rem;
      }

      .hero-logo {
        width: min(78vw, 390px);
        max-height: 44vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <header class="hero" aria-label="Bethany Does Things">
    <img
      class="hero-background"
      src="assets/images/brand/main-page-hero-background.png"
      alt=""
      fetchpriority="high"
    >

    <img
      class="hero-logo"
      src="assets/images/brand/website-logo.png"
      alt="Bethany Does Things"
      fetchpriority="high"
    >
  </header>

  <main>
    <section class="intro" aria-labelledby="intro-heading">
      <div class="intro-content">
        <h1 id="intro-heading">A little puzzle magic is on its way.</h1>
        <p>
          We're building a new home for puzzles, challenges, creative projects
          and more.
        </p>
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="description" content="Bethany Does Things — puzzles, projects and a little bit of fun.">
  <title>Bethany Does Things</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 2rem; color: #30234a;
      background: radial-gradient(circle at 20% 15%, #ffe0f1, transparent 38%),
                  radial-gradient(circle at 85% 80%, #c8f7f3, transparent 42%),
                  linear-gradient(135deg, #f8eaff, #eef4ff);
    }
    main { max-width: 42rem; text-align: center; padding: 3rem 2rem;
      border: 1px solid #ffffffb8; border-radius: 2rem;
      background: #ffffffbd; box-shadow: 0 1.5rem 5rem #60428a20; }
    h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.05; }
    p { font-size: 1.1rem; line-height: 1.7; }
    .sparkle { font-size: 2rem; }
  </style>
</head>
<body>
  <main>
    <div class="sparkle" aria-hidden="true">✦ ✧ ✦</div>
    <h1>Bethany Does Things</h1>
    <p>A little puzzle magic is on its way.</p>
    <p>We're building a new home for puzzles, challenges, creative projects and more.</p>
  </main>
</body>
</html>

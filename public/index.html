<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08060d">
  <meta name="description" content="Bethany Does Things — puzzles, projects and a little bit of fun.">
  <title>Bethany Does Things</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #30234a;
      background: #fffaff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 200px; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }

    .site-header {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(.6rem, 1vw, 1.25rem);
      height: 92px;
      min-height: 92px;
      padding: 0 clamp(1rem, 2.5vw, 2.75rem);
      overflow: visible;
      color: #fff;
      background: #08070b;
      border-bottom: 1px solid rgb(225 75 255 / 22%);
      box-shadow: 0 4px 22px rgb(0 0 0 / 28%);
    }
    .brand-link {
      position: absolute;
      z-index: 3;
      top: 0;
      left: clamp(1rem, 2.5vw, 2.75rem);
      display: inline-flex;
      align-items: flex-start;
      width: clamp(142.5px, 10.5vw, 180px);
      height: 135px;
      min-width: 0;
      text-decoration: none;
    }
    .brand-logo {
      display: block;
      width: 100%;
      max-height: 135px;
      object-fit: contain;
      object-position: left center;
    }
    .primary-nav {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: space-evenly;
      gap: 0;
      min-width: 0;
      margin-left: clamp(230px, 15.5vw, 260px);
      flex: 1 1 auto;
    }
    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      min-height: 84px;
      flex: 0 1 auto;
      padding: 0 .12rem;
      color: #f8f5fb;
      font-size: clamp(.88rem, .95vw, 1.05rem);
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      transition: color .18s ease;
    }
    .nav-link:hover, .nav-link:focus-visible, .nav-link[aria-current="page"] {
      color: #ff59c7;
    }
    .nav-link[aria-current="page"]::after {
      position: absolute;
      right: -9px;
      bottom: -1px;
      left: -9px;
      height: 5px;
      content: "";
      background: #ed2ba9;
      box-shadow: 0 0 12px rgb(237 43 169 / 65%);
    }
    .nav-icon { font-size: 1.4em; line-height: 1; }
    .tiktok-link {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      min-height: 62px;
      padding: .65rem .9rem;
      border: 1px solid #ff83d8;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #ff65c5, #e6008e);
      box-shadow: 0 3px 15px rgb(255 36 169 / 28%), inset 0 1px 0 rgb(255 255 255 / 35%);
      font-size: .92rem;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s ease, filter .18s ease;
    }
    .tiktok-link { margin-left: auto; flex-shrink: 0; }
    .tiktok-link:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .menu-toggle {
      display: none;
      width: 64px;
      height: 64px;
      padding: 0;
      border: 1px solid #8b3e9d;
      border-radius: 14px;
      color: #fff;
      background: #21112b;
      font-size: 2rem;
      cursor: pointer;
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 70vh;
      min-height: min(820px, 85svh);
      padding: 3rem clamp(2rem, 6vw, 6rem);
      overflow: hidden;
      isolation: isolate;
      background: #30234a;
    }
    .hero::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, rgb(20 12 35 / 18%) 0%, rgb(20 12 35 / 7%) 38%, rgb(20 12 35 / 0%) 68%);
    }
    .hero-background {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .hero-logo {
      display: block;
      width: clamp(260px, 35vw, 510px);
      max-height: 58vh;
      object-fit: contain;
      object-position: left center;
      filter: drop-shadow(0 8px 24px rgb(0 0 0 / 28%));
    }


    .puzzle-map-section {
      padding: 0;
      color: #fff;
      text-align: center;
      background: linear-gradient(145deg, #17102e, #302052 55%, #17102e);
    }
    .puzzle-map-heading { margin: 0 auto 1.5rem; max-width: 60rem; }
    .puzzle-map-heading h1 {
      margin: 0 0 .55rem;
      color: #fff;
      font-size: clamp(2rem, 4.5vw, 3.25rem);
      text-shadow: 0 3px 14px rgb(0 0 0 / 45%);
    }
    .puzzle-map-heading p {
      margin: 0;
      color: #f3ddff;
      font-size: clamp(.98rem, 2vw, 1.15rem);
      line-height: 1.6;
    }
    .puzzle-map {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      margin: 0;
      overflow: hidden;
      isolation: isolate;
      border: 0;
      border-radius: 0;
      background: #140d2b url("https://raw.githubusercontent.com/BethanyDoesThings/bethany-does-things/homepage-development/assets/images/backgrounds/puzzles-navigation-background.png") center / 100% 100% no-repeat;
      box-shadow: 0 14px 42px rgb(0 0 0 / 45%), 0 0 24px rgb(205 91 255 / 22%);
    }
    .puzzle-hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 18px;
      background: rgb(255 255 255 / 0%);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .puzzle-hotspot:hover, .puzzle-hotspot:focus-visible {
      border-color: transparent;
      outline: none;
      background: transparent;
      box-shadow: none;
    }
    .puzzle-hotspot.track { left: 28%; top: 7%; width: 27%; height: 28%; }
    .puzzle-hotspot.murdoku { left: 54%; top: 6%; width: 27%; height: 29%; }
    .puzzle-hotspot.diamond { left: 2%; top: 28%; width: 33%; height: 30%; }
    .puzzle-hotspot.murder-search { left: 72%; top: 24%; width: 27%; height: 31%; }
    .puzzle-hotspot.jigsaw { left: 8%; top: 54%; width: 34%; height: 37%; }
    .puzzle-hotspot.crime { left: 64%; top: 52%; width: 34%; height: 37%; }
    .puzzle-map-status {
      min-height: 1.6em;
      margin: 1rem auto 0;
      color: #f8e8ff;
      font-size: .98rem;
      font-weight: 650;
    }
    .puzzle-map-hint { margin: .35rem auto 0; color: #d7c4ec; font-size: .88rem; }

    .intro {
      padding: clamp(3rem, 8vw, 6rem) 1.5rem;
      text-align: center;
      background:
        radial-gradient(circle at 15% 15%, #ffe0f1 0, transparent 38%),
        radial-gradient(circle at 85% 80%, #c8f7f3 0, transparent 42%),
        linear-gradient(135deg, #fffaff, #eef4ff);
    }
    .intro-content { width: min(100%, 48rem); margin: 0 auto; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; }
    .intro p { max-width: 42rem; margin: 0 auto 1rem; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.75; }

    @media (max-width: 1450px) {
      .site-header { height: auto; min-height: 150px; gap: 1rem; padding: 8px 1.25rem; }
      .brand-link { position: static; width: clamp(225px, 22.5vw, 322.5px); height: auto; }
      .brand-logo { max-height: 102px; }
      .primary-nav { margin-left: 0; }
      .menu-toggle { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; margin-left: auto; }
      .primary-nav {
        position: absolute;
        top: calc(100% + 1px);
        right: 0;
        left: 0;
        display: none;
        align-items: stretch;
        gap: 0;
        padding: .6rem 1.25rem 1.25rem;
        background: #08070b;
        border-bottom: 1px solid #9135a6;
        box-shadow: 0 14px 22px rgb(0 0 0 / 30%);
      }
      .primary-nav.is-open { display: flex; flex-direction: column; }
      .nav-link { justify-content: flex-start; min-height: 66px; padding: .5rem .8rem; font-size: 1.25rem; gap: .75rem; }
      .nav-icon { font-size: 1.55em; }
      .nav-link[aria-current="page"]::after { top: 10px; right: auto; bottom: 10px; left: 0; width: 5px; height: auto; }
      .tiktok-link { min-height: 58px; padding-inline: 1.2rem; font-size: 1.05rem; }
    }
    @media (max-width: 820px) {
      .site-header { min-height: 124px; padding: 7px .9rem; gap: .65rem; }
      .brand-link { width: min(34.5vw, 225px); }
      .brand-logo { max-height: 82.5px; }
      .menu-toggle { width: 56px; height: 56px; font-size: 1.8rem; }
      .tiktok-link { min-height: 50px; padding: .65rem .85rem; font-size: .88rem; gap: .35rem; }
      .hero { min-height: 62vh; min-height: 62svh; justify-content: center; padding: 2rem 1.25rem; }
      .hero-logo { width: min(78vw, 390px); max-height: 44vh; }
    }
    @media (max-width: 480px) {
      .site-header { min-height: 104px; gap: .45rem; padding-inline: .65rem; }
      .brand-link { width: min(32.25vw, 180px); }
      .brand-logo { max-height: 69px; }
      .menu-toggle { width: 48px; height: 48px; font-size: 1.55rem; }
      .tiktok-link { min-height: 44px; padding: .55rem .6rem; font-size: .72rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body id="home">
  <header class="site-header">
    <a class="brand-link" href="#home" aria-label="Bethany Does Things home">
      <img class="brand-logo" src="assets/images/branding/website-logo.png" alt="Bethany Does Things">
    </a>

    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation">
      <span aria-hidden="true">☰</span>
    </button>

    <nav class="primary-nav" id="primary-navigation" aria-label="Main navigation">
      <a class="nav-link" href="#home" aria-current="page"><span class="nav-icon" aria-hidden="true">⌂</span>Home</a>
      <a class="nav-link" href="#puzzle-room"><span class="nav-icon" aria-hidden="true">🧩</span>Puzzle Map</a>
      <a class="nav-link" href="#challenge-board"><span class="nav-icon" aria-hidden="true">🏆</span>Challenge Board</a>
      <a class="nav-link" href="#meet-bethany"><span class="nav-icon" aria-hidden="true">👤</span>Meet Bethany</a>
      <a class="nav-link" href="#latest-things"><span class="nav-icon" aria-hidden="true">🎬</span>Latest Things</a>
      <a class="nav-link" href="#get-in-touch"><span class="nav-icon" aria-hidden="true">✉</span>Get in Touch</a>
    </nav>

    <a class="tiktok-link" href="https://www.tiktok.com/@bethany.does.thing" target="_blank" rel="noopener noreferrer">
      <span aria-hidden="true">♪</span> Watch on TikTok <span aria-hidden="true">↗</span>
    </a>
  </header>

  <section class="hero" aria-label="Bethany Does Things">
    <img class="hero-background" src="assets/images/backgrounds/main-page-hero-background.png" alt="" fetchpriority="high">
    <img class="hero-logo" src="assets/images/branding/website-logo.png" alt="Bethany Does Things" fetchpriority="high">
  </section>

  <main>
    <section class="puzzle-map-section" id="puzzle-room" aria-labelledby="puzzle-map-title">
      <div class="puzzle-map" role="group" aria-label="Interactive puzzle map">
        <a class="puzzle-hotspot track" href="/games/train-track/" aria-label="Open Track Puzzles"></a>
        <button class="puzzle-hotspot murdoku" type="button" data-puzzle-name="Murdoku" aria-label="Murdoku — coming soon" title="Murdoku — coming soon"></button>
        <a class="puzzle-hotspot diamond" href="/games/diamond-art/" aria-label="Open Diamond Art Puzzle" title="Diamond Art Puzzle"></a>
        <button class="puzzle-hotspot murder-search" type="button" data-puzzle-name="Murder Search" aria-label="Murder Search — coming soon" title="Murder Search — coming soon"></button>
        <button class="puzzle-hotspot jigsaw" type="button" data-puzzle-name="Jigsaw Puzzles" aria-label="Jigsaw Puzzles — coming soon" title="Jigsaw Puzzles — coming soon"></button>
        <button class="puzzle-hotspot crime" type="button" data-puzzle-name="Crime / Mystery Puzzles" aria-label="Crime / Mystery Puzzles — coming soon" title="Crime / Mystery Puzzles — coming soon"></button>
      </div>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const navigation = document.querySelector("#primary-navigation");

    menuButton.addEventListener("click", () => {
      const isOpen = navigation.classList.toggle("is-open");
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
      menuButton.querySelector("span").textContent = isOpen ? "×" : "☰";
    });

    document.querySelectorAll(".puzzle-hotspot[data-puzzle-name]").forEach((hotspot) => {
      hotspot.addEventListener("click", () => {
        // Reserved for future puzzle destinations; the map artwork remains visually unobstructed.
      });
    });

    navigation.addEventListener("click", (event) => {
      if (event.target.closest("a")) {
        navigation.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open navigation menu");
        menuButton.querySelector("span").textContent = "☰";
      }
    });
  </script>
</body>
</html>
